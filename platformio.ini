; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs    = release

[env:release]
build_type      = release
extends         = M5Stack-cores3, arduino-esp32, serial
monitor_filters = esp32_exception_decoder, direct, send_on_enter, time  ;, log2file

build_flags =
        -std=gnu++17
        -D CORE_DEBUG_LEVEL=4
        -D CONFIG_ARDUHAL_LOG_COLORS
        -D ARDUINO_USB_CDC_ON_BOOT=0

build_unflags =
        -std=gnu++11

[M5Stack-ATOM]
board = m5stack-atom

[M5StickC-Plus]
board = m5stack-atom

[M5Stack-cores3]
board = m5stack-cores3

[serial]
upload_protocol   = esptool
upload_speed      = 1500000
monitor_speed     = 115200
monitor_echo      = yes

[auto]
targets           = upload, monitor

[arduino-esp32]
platform          = espressif32@^8.0.0
framework         = arduino

board_build.mcu         = esp32s3
board_build.f_cpu       = 240000000L
board_build.f_flash     = 80000000L
board_build.flash_mode  = dio
board_build.partitions  = min_spiffs.csv

lib_deps =
        ; Basic
        ;FS
        ;Wire
        ;SPI
        ;SPIFFS
        ;SD
        ;WiFi
        ;HTTPClient
        ;WiFiClientSecure
        ;Ticker
        ;
        ;https://github.com/LennartHennigs/Button2.git
        ;https://github.com/m5stack/M5GFX.git
        https://github.com/riraosan/StackChan-BSP.git
        https://github.com/stack-chan/m5stack-avatar.git
